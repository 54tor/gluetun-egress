# Versions supposées : Docker Engine >= 28 (testé 29.8.1), Docker Compose >= 2.24 (testé 5.5.1),
# Testé avec Gluetun v3.41.3 ; les images ne sont pas épinglées.
#
# Plan d'adressage (doit rester cohérent avec .env, gateway/*, gluetun/post-rules-*.txt, caddy/*) :
#   frontend    172.30.10.0/24  caddy .10   | gluetun1 .11 | gluetun2 .12 | gluetun3 .13
#   vpn-gateway 172.30.20.0/24  gateway .2  | caddy   .10 | gluetun1 .11 | gluetun2 .12 | gluetun3 .13  (internal)

name: vpnstack

x-gluetun: &gluetun
  image: qmcgaw/gluetun:latest
  cap_add: [NET_ADMIN]
  devices: [/dev/net/tun:/dev/net/tun]
  sysctls:
    net.ipv4.ip_forward: "1"          # forwarding gateway -> tun0 (policy FORWARD reste DROP)
    net.ipv6.conf.all.disable_ipv6: "0"
    net.ipv6.conf.all.forwarding: "1" # idem en IPv6 ; sans effet pour un VPN sans adresse IPv6 (WIREGUARD_ADDRESSES)
    # Les connecteurs wgentry partagent cette pile et ouvrent leurs connexions vers le proxy d'entrée depuis ici :
    # la plage par défaut (32768-60999) plafonne à ≈ 28 000 connexions simultanées par tunnel.
    net.ipv4.ip_local_port_range: "1024 65535"
  dns:
    - 9.9.9.9
  # Un serveur lent ou muet est recalé et remplacé avant que la pile démarre (gluetun-egress, vpn-check.sh).
  healthcheck:
    test: ["CMD", "sh", "/gateway-state/vpn-check.sh"]   # déposé par le gateway dans le volume gateway-state
    interval: 30s
    timeout: 60s
    retries: 3
    start_period: 4m
    start_interval: 10s
  restart: unless-stopped

x-wgentry: &wgentry
  # Tunnel WireGuard sortant vers le relais (wireproxy, en espace utilisateur), dans la pile du Gluetun : l'UDP sort par son VPN.
  image: ghcr.io/windtf/wireproxy:latest
  # Aucune capacité : NET_RAW (défaut Docker) permettrait de contourner nftables et d'usurper l'ARP sur vpn-gateway.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  gluetun1:
    <<: *gluetun
    env_file: [.env.vpn1]             # VPN_SERVICE_PROVIDER, VPN_TYPE, clés/identifiants du fournisseur 1
    environment:
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"   # boucle locale seulement : le rôle ci-dessous est sans authentification
      # Clé d'API sur toute l'API de contrôle ; vpn-check.sh la présente pour changer de serveur (PUT /v1/vpn/status).
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${VPN_CHECK_APIKEY:?VPN_CHECK_APIKEY à définir dans .env}"}'
      VPN_CHECK_APIKEY: ${VPN_CHECK_APIKEY}
      VPN_INTERFACE: tun0               # même nom pour OpenVPN et WireGuard -> post-rules.txt stable
      TZ: ${TZ}
      # wgentryN (frontend) et le gateway (vpn-gateway) vivent derrière cette pile : leurs réseaux restent joignables.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.10.0/24,172.30.20.0/24,fd30:20::/64
      VPN_CHECK_NAME: vpn2              # nom du tunnel dans /run/gateway/up (rang dans VPN_IPS du gateway)
      VPN_CHECK_RECHECK_SECONDS: ${VPN_CHECK_RECHECK_SECONDS:-0}
      VPN_CHECK_FAST_START: ${VPN_CHECK_FAST_START:-1}
      VPN_CHECK_ENGINE: ${VPN_CHECK_ENGINE:-http}
      VPN_CHECK_REROLL_ONLY_IF_OTHER_UP: ${VPN_CHECK_REROLL_ONLY_IF_OTHER_UP:-1}
      VPN_CHECK_OOKLA_ACCEPT_LICENSE: ${VPN_CHECK_OOKLA_ACCEPT_LICENSE:-yes}
    volumes:
      - gateway-state:/gateway-state:ro
      - measure-vpn1:/gateway-measure           # la mesure de CE tunnel, seul dossier où ce Gluetun écrit
      - ../gluetun/post-rules-1.txt:/iptables/post-rules.txt:ro
    networks:
      frontend:    { ipv4_address: 172.30.10.11 }
      vpn-gateway: { ipv4_address: 172.30.20.11, ipv6_address: "fd30:20::11" }

  gluetun2:
    <<: *gluetun
    env_file: [.env.vpn2]             # VPN_SERVICE_PROVIDER, VPN_TYPE, clés/identifiants du fournisseur 2
    environment:
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"   # boucle locale seulement : le rôle ci-dessous est sans authentification
      # Clé d'API sur toute l'API de contrôle ; vpn-check.sh la présente pour changer de serveur (PUT /v1/vpn/status).
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${VPN_CHECK_APIKEY:?VPN_CHECK_APIKEY à définir dans .env}"}'
      VPN_CHECK_APIKEY: ${VPN_CHECK_APIKEY}
      VPN_INTERFACE: tun0               # même nom pour OpenVPN et WireGuard -> post-rules.txt stable
      TZ: ${TZ}
      # wgentryN (frontend) et le gateway (vpn-gateway) vivent derrière cette pile : leurs réseaux restent joignables.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.10.0/24,172.30.20.0/24,fd30:20::/64
      VPN_CHECK_NAME: vpn1
      VPN_CHECK_RECHECK_SECONDS: ${VPN_CHECK_RECHECK_SECONDS:-0}
      VPN_CHECK_FAST_START: ${VPN_CHECK_FAST_START:-1}
      VPN_CHECK_ENGINE: ${VPN_CHECK_ENGINE:-http}
      VPN_CHECK_REROLL_ONLY_IF_OTHER_UP: ${VPN_CHECK_REROLL_ONLY_IF_OTHER_UP:-1}
      VPN_CHECK_OOKLA_ACCEPT_LICENSE: ${VPN_CHECK_OOKLA_ACCEPT_LICENSE:-yes}
    volumes:
      - gateway-state:/gateway-state:ro
      - measure-vpn2:/gateway-measure           # la mesure de CE tunnel, seul dossier où ce Gluetun écrit
      - ../gluetun/post-rules-2.txt:/iptables/post-rules.txt:ro
    networks:
      frontend:    { ipv4_address: 172.30.10.12 }
      vpn-gateway: { ipv4_address: 172.30.20.12, ipv6_address: "fd30:20::12" }

  gluetun3:
    <<: *gluetun
    env_file: [.env.vpn3]             # VPN_SERVICE_PROVIDER, VPN_TYPE, clés/identifiants du fournisseur 3
    environment:
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"   # boucle locale seulement : le rôle ci-dessous est sans authentification
      # Clé d'API sur toute l'API de contrôle ; vpn-check.sh la présente pour changer de serveur (PUT /v1/vpn/status).
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${VPN_CHECK_APIKEY:?VPN_CHECK_APIKEY à définir dans .env}"}'
      VPN_CHECK_APIKEY: ${VPN_CHECK_APIKEY}
      VPN_INTERFACE: tun0               # même nom pour OpenVPN et WireGuard -> post-rules.txt stable
      TZ: ${TZ}
      # wgentryN (frontend) et le gateway (vpn-gateway) vivent derrière cette pile : leurs réseaux restent joignables.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.10.0/24,172.30.20.0/24
      VPN_CHECK_NAME: vpn3
      VPN_CHECK_RECHECK_SECONDS: ${VPN_CHECK_RECHECK_SECONDS:-0}
      VPN_CHECK_FAST_START: ${VPN_CHECK_FAST_START:-1}
      VPN_CHECK_ENGINE: ${VPN_CHECK_ENGINE:-http}
      VPN_CHECK_REROLL_ONLY_IF_OTHER_UP: ${VPN_CHECK_REROLL_ONLY_IF_OTHER_UP:-1}
      VPN_CHECK_OOKLA_ACCEPT_LICENSE: ${VPN_CHECK_OOKLA_ACCEPT_LICENSE:-yes}
    volumes:
      - gateway-state:/gateway-state:ro
      - measure-vpn3:/gateway-measure           # la mesure de CE tunnel, seul dossier où ce Gluetun écrit
      - ../gluetun/post-rules-3.txt:/iptables/post-rules.txt:ro
    networks:
      frontend:    { ipv4_address: 172.30.10.13 }
      # IPv6 fixe même sans VPN IPv6 : sinon Docker attribue la première libre (fd30:20::2, celle du gateway).
      vpn-gateway: { ipv4_address: 172.30.20.13, ipv6_address: "fd30:20::13" }
  wgentry1:
    <<: *wgentry
    network_mode: "service:gluetun1"
    volumes:
      - ./wgentry/wg1.conf:/etc/wireproxy/config:ro   # clé du tunnel, droits 600, propriétaire uid 65532
    depends_on:
      gluetun1: { condition: service_healthy, restart: true }

  wgentry2:
    <<: *wgentry
    network_mode: "service:gluetun2"
    volumes:
      - ./wgentry/wg2.conf:/etc/wireproxy/config:ro   # clé du tunnel, droits 600, propriétaire uid 65532
    depends_on:
      gluetun2: { condition: service_healthy, restart: true }

  wgentry3:
    <<: *wgentry
    network_mode: "service:gluetun3"
    volumes:
      - ./wgentry/wg3.conf:/etc/wireproxy/config:ro   # clé du tunnel, droits 600, propriétaire uid 65532
    depends_on:
      gluetun3: { condition: service_healthy, restart: true }

  caddy:
    image: caddy:alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro   # lu avec APP_PORT (placeholder {$APP_PORT})
    environment:
      APP_PORT: ${APP_PORT}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
    networks:
      frontend:    { ipv4_address: 172.30.10.10 }   # entrée depuis wgentry ; route par défaut de Caddy
      vpn-gateway: { ipv4_address: 172.30.20.10, ipv6_address: "fd30:20::10" }   # accès direct L2 à l'application (172.30.20.2)
    restart: unless-stopped

  # Le gateway ne monte pas le socket Docker : il parle à ce proxy, qui ne laisse passer que la relance des wgentry (README §7). Le
  # socket filtré vit dans un volume que seul le gateway monte : l'application, qui partage son réseau mais pas son système de
  # fichiers, n'y accède pas. Surveillance du port redirigé (PORT_FORWARD_n) : voir le README §7 pour les deux autorisations de plus.
  socket-proxy:
    image: wollomatic/socket-proxy:1
    user: "0:0"                          # root sans capacité : propriétaire du socket de l'hôte, sans CAP_DAC_OVERRIDE
    command:
      - -proxysocketendpoint=/proxy/docker.sock
      - -allowPOST=^(/v[0-9.]+)?/containers/vpnstack-wgentry[0-9]+-1/restart$$
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-proxy:/proxy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  gateway:
    build: ../gateway
    depends_on:
      socket-proxy: { condition: service_started }
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "0"                  # l'app est locale au namespace : rien à forwarder
      # rp_filter : en état "aucun VPN" la table main n'a qu'une route unreachable ; le filtre
      # rejetterait alors les réponses des sondes (routées par uid vers les tables 101/102).
      # Valeur effective = max(all, eth0) : all ici, eth0 via driver_opts du réseau (voir plus bas).
      net.ipv4.conf.all.rp_filter: "0"
      # Répartition (EGRESS_MODE=balance-*) : 0 = par destination (balance-dest), 1 = par connexion (balance-flow).
      net.ipv4.fib_multipath_hash_policy: ${EGRESS_HASH_POLICY:-0}
      net.ipv6.fib_multipath_hash_policy: ${EGRESS_HASH_POLICY:-0}
    environment:
      EGRESS_MODE: ${EGRESS_MODE:-failover}
      HEALTH_REQUIRE_EGRESS: ${HEALTH_REQUIRE_EGRESS:-1}
      APP_PORT: ${APP_PORT}
      # Couples « ip:port » en plus de Caddy -> APP_PORT. Vides ici : l'application d'exemple n'en a pas besoin.
      ALLOW_IN: ""          # ex. "172.30.20.11:4041" : un second client du LAN qui appelle l'application
      ALLOW_OUT: ""         # ex. "172.30.20.20:6379" : un service du LAN que l'application appelle
      LAN_SUBNET: 172.30.20.0/24
      INGRESS_IP: 172.30.20.10
      VPN_IPS: 172.30.20.12 172.30.20.11 172.30.20.13   # ordre = priorité (gluetun2, gluetun1, custom)
      # IPv6 : l'adresse de chaque Gluetun qui en a une, dans le même ordre (ici les deux premiers ; custom n'en a pas).
      VPN_IPS6: fd30:20::12 fd30:20::11
      LAN_SUBNET6: fd30:20::/64
      PROBE_URLS6: ${PROBE_URLS6}
      PROBE_URLS: ${PROBE_URLS}
      PROBE_INTERVAL: ${PROBE_INTERVAL}
      PROBE_INTERVAL_DOWN: ${PROBE_INTERVAL_DOWN:-1}
      PROBE_TIMEOUT: ${PROBE_TIMEOUT}
      FAIL_THRESHOLD: ${FAIL_THRESHOLD}
      RISE_THRESHOLD: ${RISE_THRESHOLD}
      DOCKER_SOCKET: /var/run/docker-proxy/docker.sock
      # Conteneurs à relancer quand le Gluetun n revient après une panne (noms Compose : <projet>-<service>-1).
      RESTART_DEPENDENTS_1: vpnstack-wgentry1-1
      RESTART_DEPENDENTS_2: vpnstack-wgentry2-1
      RESTART_DEPENDENTS_3: vpnstack-wgentry3-1
    volumes:
      - docker-proxy:/var/run/docker-proxy:ro      # socket Docker filtré par socket-proxy : relance de conteneurs seulement
      - gateway-state:/run/gateway                  # donne aux Gluetun vpn-check.sh et la liste des tunnels en vie (« up »)
      # Mesures des tunnels (latence, débit), écrites par chaque Gluetun : lues ici, jamais écrites.
      - measure-vpn1:/run/gateway-measure/vpn1:ro
      - measure-vpn2:/run/gateway-measure/vpn2:ro
      - measure-vpn3:/run/gateway-measure/vpn3:ro
    healthcheck:
      # "healthy" = firewall fail-closed chargé ET sortie réelle établie (un VPN validé par les sondes). L'app ne démarre donc
      # qu'avec Internet. HEALTH_REQUIRE_EGRESS=0 : seulement le firewall (l'app démarre sans sortie, elle n'a simplement pas Internet).
      test: ["CMD-SHELL", "nft list table inet vpngw >/dev/null && { [ \"$${HEALTH_REQUIRE_EGRESS:-1}\" = 0 ] || [ \"$$(cat /run/gateway/active)\" != none ]; }"]
      interval: 10s
      start_period: 5s
    networks:
      vpn-gateway:                                  # UNIQUE réseau -> seul eth0 visible par l'app
        ipv4_address: 172.30.20.2
        ipv6_address: "fd30:20::2"
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv4.conf.IFNAME.rp_filter=0,net.ipv6.conf.IFNAME.accept_ra=0
    restart: unless-stopped

  app:
    image: traefik/whoami:latest        # remplacer par l'application réelle
    command: ["--port", "${APP_PORT}"]
    network_mode: "service:gateway"      # partage netns, /etc/resolv.conf et /etc/hosts du gateway
    cap_drop: [ALL]                      # sans NET_RAW : pas de socket brut qui contourne nftables
    security_opt: ["no-new-privileges:true"]
    depends_on:
      gateway: { condition: service_healthy, restart: true }
    restart: unless-stopped

volumes:
  gateway-state:
  docker-proxy:
  measure-vpn1:
  measure-vpn2:
  measure-vpn3:

networks:
  frontend:
    driver: bridge
    ipam:
      config: [{ subnet: 172.30.10.0/24, gateway: 172.30.10.1 }]
  vpn-gateway:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: vpngw-egress
    internal: true                       # aucune route vers l'Internet du host, isolation Docker côté host
    enable_ipv6: true                    # ULA : la sortie IPv6 est traduite (NAT66) dans chaque Gluetun
    ipam:
      config:
        - { subnet: 172.30.20.0/24, gateway: 172.30.20.1 }
        - { subnet: "fd30:20::/64", gateway: "fd30:20::1" }
