# Traefik -> application, en direct sur le réseau vpn-gateway (L2), jamais via un Gluetun.
# 172.30.20.2 = IP du gateway, dont l'application partage le namespace réseau.
http:
  routers:
    app:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      service: app
  services:
    app:
      loadBalancer:
        servers:
          - url: "http://172.30.20.2:{{ env "APP_PORT" }}"
